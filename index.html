<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Common Mistakes in English — Study App</title>
<style>
:root{color-scheme:light;--bg:#f3e8da;--card:#fffaf2;--ink:#3b2a20;--mut:#7d6757;--line:#e4d3bf;--pri:#8b5a3c;--pri2:#f1e1cf;--ok:#2f6b3a;--okbg:#e9f1e0;--bad:#a3262a;--badbg:#f9e4de;--warn:#a8641a;--warnbg:#fbeccd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Bengali","Nirmala UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
/* daily target */
#daily{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
#daily .row{display:flex;align-items:center;gap:10px;padding:8px 0}
#daily h1{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);white-space:nowrap}
.bars{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{font-size:11px;color:var(--mut)}
.bar .t{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:2px}
.bar .t i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.bar.done .t i{background:var(--ok)}
.streak{font-size:13px;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:2px 8px}
#tset{display:none;padding:0 0 10px;font-size:14px}
#tset.open{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#tset input{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 7px;font-size:12px;color:var(--mut)}
nav button b{display:block;font-size:20px;line-height:1.1}
nav button.on{color:var(--pri);font-weight:600}
section.view{display:none;padding:12px 0}
section.view.on{display:block}
h2{font-size:20px;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],select,.inp{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;min-width:0}
input[type=search]{flex:1}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--pri2);color:var(--pri);font-size:12px;margin-right:4px}
.dont,.say{padding:7px 10px;border-radius:10px;margin:6px 0}
.dont{background:var(--badbg);color:var(--bad)}
.say{background:var(--okbg);color:var(--ok)}
.dont:before{content:"✗ Don't say: ";font-weight:600}
.say:before{content:"✓ Say: ";font-weight:600}
.note{font-size:14px;color:var(--mut);margin-top:6px;white-space:pre-wrap}
.ttl{font-weight:600}
.num{color:var(--pri);margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);padding:11px 13px;border-radius:12px;margin:8px 0}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{opacity:1;cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--mut)}
.mut{color:var(--mut);font-size:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--warn)}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--pri)}
.flip{min-height:150px;display:flex;flex-direction:column;justify-content:center}
.bk p{margin:0 0 7px}
.bk .pg{text-align:center;color:var(--mut);font-size:12px;margin:12px 0}
.bk .h{font-weight:700}
.hit{background:var(--warnbg);padding:1px 3px;border-radius:4px}
.res{border-left:4px solid var(--bad);padding-left:10px;margin:10px 0}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
</style>
</head>
<body>
<header id="daily"><div class="wrap">
 <div class="row">
  <h1>🎯 Daily target</h1>
  <div class="bars">
   <div class="bar" id="bS"><span id="bSt">Study 0/10</span><div class="t"><i></i></div></div>
   <div class="bar" id="bP"><span id="bPt">Practice 0/20</span><div class="t"><i></i></div></div>
  </div>
  <span class="streak" id="streak">🔥 0</span>
  <button class="iconbtn" id="gear" aria-label="Set target">⚙</button>
 </div>
 <div id="tset">
  <label>Study items/day <input type="number" id="tS" min="1" max="100"></label>
  <label>Practice questions/day <input type="number" id="tP" min="1" max="200"></label>
  <button class="btn sm pri" id="tSave">Save</button>
 </div>
</div></header>

<div class="wrap">
<section class="view on" id="v-study">
 <h2 style="font-size:18px;margin:2px 0 6px">📖 Study</h2>
 <div class="card" id="readbox" style="padding:6px 10px;margin:4px 0 8px;border-radius:10px"></div>
 <div class="row2">
  <input type="search" id="sq" placeholder="Search rule or sentence…">
 </div>
 <div class="row2" style="margin-top:8px">
  <select id="sg"></select>
  <select id="sf"><option value="all">All</option><option value="new">Not read yet</option><option value="done">Read (পড়া হয়েছে)</option><option value="star">Starred</option></select>
 </div>
 <div class="mut" id="scount" style="margin:8px 2px"></div>
 <div id="slist"></div>
 <div class="empty" id="smore" style="display:none"><button class="btn" id="smoreb">Show more</button></div>
</section>

<section class="view" id="v-practice">
 <h2>✍️ Practice</h2>
 <div class="stats" id="pstats"></div>
 <div class="card">
  <div class="row2">
   <select id="pmode"><option value="mcq">Pick the correct sentence</option><option value="flash">Flashcards</option></select>
   <select id="psrc"><option value="all">All questions</option><option value="read">Rules I have read</option><option value="new">Not read yet</option><option value="wrong">My mistakes</option><option value="star">Starred</option></select>
   <button class="btn pri" id="pstart">Start</button>
  </div>
 </div>
 <div id="parea"></div>
</section>

<section class="view" id="v-exam">
 <h2>📝 Exam</h2>
 <div id="exsetup">
  <div class="card">
   <p style="margin-top:0">Timed mock test. 4 options per question, only one is correct. Pass mark: 60%.</p>
   <div class="row2" style="margin-bottom:8px">
    <select id="exsrc" class="inp"><option value="read">Only rules I have read (পড়া নিয়ম)</option><option value="all">All rules</option></select>
   </div>
   <div class="mut" id="exinfo" style="margin-bottom:8px"></div>
   <div class="row2">
    <select id="exn"><option>10</option><option selected>20</option><option>30</option><option>50</option></select>
    <span class="mut">questions · 30 sec each</span>
    <button class="btn pri" id="exstart">Start exam</button>
   </div>
  </div>
  <h3 style="margin:16px 2px 4px;font-size:16px">History</h3>
  <div id="exhist"></div>
 </div>
 <div id="exrun" style="display:none"></div>
</section>


</div>

<nav>
 <button data-t="study" class="on"><b>📖</b>Study</button>
 <button data-t="practice"><b>✍️</b>Practice</button>
 <button data-t="exam"><b>📝</b>Exam</button>
</nav>

<script>
const DATA={"items":[{"n":1,"title":"Absorbed (= গভীরভাবে নিবিষ্ট বা নিমগ্ন) in, at বসবে না।","dont":["The man was absorbed at his work."],"say":["The man was absorbed in his work."],"note":"Note: Absorbed (= very much interested)-এর পরে appropriate preposition ‘in’ বসে। Absorbed-এর পরে ‘at’ বসে না।","pg":3,"q":true},{"n":2,"title":"Accuse of (অভিযুক্ত করা / দোষী করা), for নয়।","dont":["She accused the man for stealing."],"say":["She accused the man of stealing."],"note":"Note: Charge-এর পরে with বসে; যেমন: The man was charged with murder.","pg":3,"q":true},{"n":3,"title":"Accustomed to (অভ্যান্ত হওয়া), with বসবে না।","dont":["I'm accustomed with hot weather."],"say":["I'm accustomed to hot weather."],"note":"Note: Also used to, যেমন: He is used to the heat.","pg":3,"q":true},{"n":4,"title":"Afraid of (ভীত / শঙ্কিত), from বসবে না।","dont":["Laura is afraid from the dog."],"say":["Laura is afraid of the dog."],"note":"Note: Afraid হল- ভীত, এরপর সঠিক preposition- ব্যবহার হল- ‘of, from বসানো সঠিক নয়।","pg":3,"q":true},{"n":5,"title":"Aim at (তোক করা), on বা against বসবে না।","dont":["She aimed on (for against) the target."],"say":["She aimed at the target."],"note":"Note: At, preposition- সর্বদা গতিপথ নির্দেশ করতে ব্যবহৃত হয়: যেমন- throw at (ঝাপিয়ে পড়া), shout at (কারো প্রতি চিৎকার করে বলা), fire at (লক্ষা করে গুলি বর্ষণ করা), shoot at (তাক করে গুলি ছোড়া)। তবে Shoot (at ব্যতীত) আঘাত করে হত্যা করা অর্থ নির্দেশ করে: যেমন- He shot a bird (= সে আঘাত করলো এবং এটা মরলো) Go to Contents","pg":3,"q":true},{"n":6,"title":"Angry with (রাগান্থিত / তুন্ধ / রুষ্ট), against নয়।","dont":["The teacher was angry against him."],"say":["The teacher was angry with him."],"note":"Note-1: আমরা ব্যক্তির সাথে with, কিন্তু বস্তুর প্রতি (41) কুদ্ধ / রুষ্ট (angry) হই, যেমন: He was angry at The weather (with the weather নয়) Note-2: Also annoyed with, vexed with, ‘indignant with’ a person, but at 4 thing. (একইভাবে ব্যক্তির ‘Are’ বোঝাতে annoyed (কুদ্ধ) with, vexed (বিরক্ত) with, indignant (ঘৃণা / ক্রোধ) with। লক্ষণীয়, at 'প্রতি' বোঝাতে উক্ত verb-গুলোর পরে with-এর পরিবর্তে at বসে","pg":4,"q":true},{"n":7,"title":"Anxious (= troubled উদ্বিগ্ন / উতৎকন্ঠিত) about, for নয়।","dont":["They’re anxious for his health."],"say":["They’re anxious about his health."],"note":"Note: But anxious meaning wishing very much takes for, as: Parents are anxious for their children's success. (তবে Anxious যখন তীব্রভাবে চাচ্ছে এমন বা প্রত্যাশী\" অর্থে ব্যবহৃত হয়, তখন about-এর পরিবর্তে for বসে; যেমন- Parents are anxious for their children’s success.)","pg":4,"q":true},{"n":8,"title":"Arrive (পৌঁছানো) at, to নয়।","dont":["We arrived to the village at night."],"say":["We arrived at the village at night."],"note":"Note: Use arrive in with countries and large cities, as: Mr Smith has arrived in London (arrive in দেশ এবং বড় শহর বোঝাতে ব্যবহৃত হয়: যেমন- Mr. Smith has arrived in London (or New York. India, etc.)","pg":4,"q":true},{"n":9,"title":"Ashamed (লজ্জিত) of, from নয়।","dont":["Now ashamed from his conduct."],"say":["He's now ashamed of his conduct."],"note":"Note: Shy লাজুক / সাবধানী / ছিধান্থিত অর্থে ashamed of ব্যবহার করা যথার্থ নয়, সুতরাং I am ashamed of my shyness-এর পরিবর্তে আপনার বলা উচিত / 7 shy of my teacher.","pg":4,"q":true},{"n":10,"title":"Believe (আস্থা / বিশ্বাস থাকা) in, to নয়।","dont":["We believe to God."],"say":["We believe in God."],"note":"Note: To believe in means to have faith in. To believe (without the in) means to regard something as true: / believe everything he says. (To believe in অর্থ হল আহ্থা / বিশ্বাস থাকা, পক্ষান্তরে To believe (in ব্যতীত) অর্থ হল- সত্য হিসেবে বিবেচনা করা (বিশ্বাস করা) যেমন-_ I believe everything he says) এপিজে","pg":4,"q":true},{"n":11,"title":"Boast of or about (অহংকার #1), for নয়।","dont":["James boasted for his strength."],"say":["James boasted of (or about) his strength."],"note":"","pg":5,"q":true},{"n":12,"title":"Careful of, with or about (যত্রবান / মনোযোগী), for নয়।","dont":["Elke’s very careful for her heal a good word for, to say so. b) to tell the truth, to tell a lie, to tell a story, to tell the time, to tell a secret, to tell the price, to tell one’s fortune, to tell one’s name.","pg":78,"q":false},{"n":399,"title":"Make এবং Do","dont":["The carpenter did a large table.","You must make your work carefully."],"say":["Say The carpenter made a large table.","You must do your work carefully."],"note":"To make প্রথমত (কোন কিছু) নির্যাণ বা উৎপাদন কর! অর্থ নির্দেশ করে; পক্ষান্তরে to do কোন কিছু করা / সুসম্পন্ন করা অর্থ নির্দেশ করে। Note: Make এবং do সমেত প্রচলিত বাগধারা (common 101))-গুলো হল: a) To make a mistake, to make a promise, to make a speech, to make an excuse, to make haste, to make fun of, to make a bed (= ঘুমানোর জন্য বিছানা ergs করা) ৮) To do good, to do evil, to do one’s best, to do one a favour, to do wrong, to do a lesson, to do problem, to do business, to do away with, to do gymnastics, to do exercises.","pg":78,"q":true},{"n":400,"title":"Lie এবং Lay.","dont":["I'm going to lay down for an hour.","Please lie the exam papers on the desk."],"say":["I'm going to lie down for an hour.","Please lay out the exam papers on the desk."],"note":"Lie (to rest= বিশ্রাম করা / শোয়া) হল একটি Intransitive verb এবং এটি কোন object গ্রহণ করে না। Lay (to put= রাখা / শোয়ানো) হল একটি transitive verb এবং সর্বদা একটি Object গ্রহণ করে। এদের প্রধান রূপ (principal parts) হল যথাক্রমে lie, lay, lain এবং lay, laid, laid. Note: Lie (lied, lied) হল অসত্য বলা বা মিথ্যা বলা, যেমন: He has lied to me. Lay (laid, laid), ডিম উৎপাদন করা (ডিম পাড়া) অর্থও নির্দেশ করে, যেমন: The hen has laid an egg (idiom- বাগধারা): Lay the table বা lay the cloth অর্থ হল খাবারের জন্য টেবিল সাজানো) (See Exercise 44 on page 143)","pg":79,"q":true},{"n":401,"title":"Sit এবং Seat","dont":[],"say":[],"note":"Sit সর্বাধিক ব্যবহৃত হয় কেবল intransitive verb হিসেবে: Seat একটি transitive verb এবং এর একটি object-এর প্রয়োজন পড়ে। বেশির ভাগ ক্ষেত্রে object-টি হয় একটি reflexive pronoun: যেমন- He seated himself near the function renderReadBox(){
 const r=readCount(),tot=ITEMS.length,today=D().study.length;
 $('#readbox').innerHTML='<div class="row2" style="justify-content:space-between;font-size:13px"><b>📖 পড়া হয়েছে: '+r+' / '+tot+'</b><span class="mut" style="font-size:12px">আজ: '+today+'</span></div><div class="prog" style="height:4px;margin:4px 0 0"><i style="width:'+(tot?r/tot*100:0)+'%"></i></div>';
}
function renderStudy(reset){
 if(reset){shown=30;filterStudy()}
 renderReadBox();
 $('#scount').textContent=sList.length+' rules shown';
 $('#slist').innerHTML=sList.slice(0,shown).map(it=>
  '<div class="card" data-k="'+it.k+'"><div class="ttl"><span class="num">'+it.n+'.</span>'+esc(it.title)+'</div>'+
  it.dont.map(x=>'<div class="dont">'+esc(x)+'</div>').join('')+it.say.map(x=>'<div class="say">'+esc(x)+'</div>').join('')+
  (it.note?'<div class="note">'+esc(it.note)+'</div>':'')+
  '<div class="row2" style="margin-top:8px"><button class="btn sm '+(S.learned[it.k]?'pri':'')+'" data-a="L">'+(S.learned[it.k]?'✓ Read — পড়া হয়েছে':'Mark as read')+'</button><button class="btn sm" data-a="S">'+(S.star[it.k]?'★ Starred':'☆ Star')+'</button><span class="mut">p.'+it.pg+'</span></div></div>').join('')||'<div class="empty">Nothing here.</div>';
 $('#smore').style.display=sList.length>shown?'block':'none';
}
$('#slist').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 const n=b.closest('.card').dataset.k;
 if(b.dataset.a==='L'){
  if(S.learned[n]){delete S.learned[n]}else{S.learned[n]=1;const d=D();if(!d.study.includes(n))d.study.push(n)}
 }else{if(S.star[n])delete S.star[n];else S.star[n]=1}
 save();renderDaily();const y=window.scrollY;renderStudy(false);renderExamInfo();window.scrollTo(0,y);
};
$('#smoreb').onclick=()=>{shown+=30;renderStudy(false)};
['sq','sg','sf'].forEach(id=>$('#'+id).addEventListener(id==='sq'?'input':'change',()=>renderStudy(true)));
/* ---------- question builder ---------- */
const QI=ITEMS.filter(i=>i.q);
function buildQ(it,nOpts){
 const right=pick(it.say),wrongOwn=pick(it.dont);
 let wrongs=[wrongOwn];
 const others=shuffle(QI.filter(x=>x.n!==it.n));
 for(const o of others){if(wrongs.length>=nOpts-1)break;wrongs.push(pick(o.dont))}
 const opts=shuffle([right].concat(wrongs));
 return{it,opts,ans:opts.indexOf(right),right};
}
const why=it=>'<div class="note"><b>'+it.n+'. '+esc(it.title)+'</b>'+(it.note?'\n'+esc(it.note.slice(0,300)):'')+'</div>';
/* ---------- practice ---------- */
function renderPStats(){
 const w=Object.keys(S.wrong).filter(k=>S.wrong[k]>0).length;
 $('#pstats').innerHTML='<div><b>'+D().practice+'</b><span>today</span></div><div><b>'+w+'</b><span>to review</span></div><div><b>'+readCount()+'</b><span>read</span></div>';
}
function poolFor(src){
 let p=QI;
 if(src==='read')p=p.filter(i=>S.learned[i.k]);
 if(src==='new')p=p.filter(i=>!S.learned[i.k]);
 if(src==='wrong')p=p.filter(i=>S.wrong[i.k]>0);
 if(src==='star')p=p.filter(i=>S.star[i.k]);
 return p;
}
let pq=null;
function nextP(){
 const mode=$('#pmode').value,pool=poolFor($('#psrc').value);
 if(!pool.length){$('#parea').innerHTML='<div class="empty">No questions in this set yet. Try “All questions”.</div>';return}
 const it=pick(pool);
 if(mode==='mcq'){
  pq=buildQ(it,2);
  $('#parea').innerHTML='<div class="card"><div class="mut">Which sentence is correct?</div>'+pq.opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+esc(o)+'</button>').join('')+'<div id="pfb"></div></div>';
 }else{
  pq={it,flash:true};
  $('#parea').innerHTML='<div class="card flip"><div class="mut">Fix this sentence, then tap “Show answer”</div><div class="dont">'+esc(pick(it.dont))+'</div><div id="pfb"></div><div class="row2" style="margin-top:8px"><button class="btn pri" id="pshow">Show answer</button></div></div>';
 }
}
$('#pstart').onclick=nextP;
$('#parea').onclick=e=>{
 const b=e.target.closest('button');if(!b||!pq)return;
 if(b.id==='pshow'){
  $('#pfb').innerHTML='<div class="say">'+esc(pick(pq.it.say))+'</div>'+why(pq.it)+'<div class="row2" style="margin-top:8px"><button class="btn" data-k="0">❌ Missed</button><button class="btn pri" data-k="1">✅ Knew it</button></div>';
  b.style.display='none';return;
 }
 if(b.dataset.k!==undefined){
  const n=pq.it.k;
  if(b.dataset.k==='1')S.wrong[n]=Math.max(0,(S.wrong[n]||0)-1);else S.wrong[n]=(S.wrong[n]||0)+1;
  save();addPractice();nextP();return;
 }
 if(b.classList.contains('opt')&&!b.disabled){
  const i=+b.dataset.i,n=pq.it.k;
  document.querySelectorAll('#parea .opt').forEach((o,k)=>{o.disabled=true;if(k===pq.ans)o.classList.add('right');else if(k===i)o.classList.add('wrong')});
  if(i===pq.ans)S.wrong[n]=Math.max(0,(S.wrong[n]||0)-1);else S.wrong[n]=(S.wrong[n]||0)+1;
  save();addPractice();
  $('#pfb').innerHTML=(i===pq.ans?'<b style="color:var(--ok)">Correct!</b>':'<b style="color:var(--bad)">Not quite.</b>')+why(pq.it)+'<div class="row2" style="margin-top:8px"><button class="btn pri" id="pnext">Next →</button></div>';
 }
 if(b.id==='pnext')nextP();
};
/* ---------- exam ---------- */
let ex=null,exT=null;
function examPool(){return $('#exsrc').value==='read'?QI.filter(i=>S.learned[i.k]):QI}
function renderExamInfo(){
 const e=readQuizCount(),r=readCount();
 $('#exinfo').innerHTML='পড়া নিয়ম: <b>'+r+'</b> টি · এর মধ্যে পরীক্ষার উপযোগী: <b>'+e+'</b> টি'+(e<4?'<br><span style="color:var(--bad)">Read-based exam needs at least 4 rules. Study সেকশনে আরও নিয়ম “Mark as read” করুন।</span>':'');
}
function startExam(){
 const pool=examPool();
 if(pool.length<4){alert($('#exsrc').value==='read'?'Please mark at least 4 rules as read in the Study section first.':'Not enough questions.');return}
 const n=Math.min(+$('#exn').value,pool.length);
 const qs=shuffle(pool).slice(0,n).map(it=>buildQ(it,4));
 ex={qs,ans:new Array(n).fill(-1),i:0,left:n*30};
 $('#exsetup').style.display='none';$('#exrun').style.display='block';
 clearInterval(exT);exT=setInterval(()=>{ex.left--;const t=$('#extime');if(t)t.textContent=fmt(ex.left);if(ex.left<=0)finishExam()},1000);
 renderEx();
}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function renderEx(){
 const q=ex.qs[ex.i],n=ex.qs.length;
 $('#exrun').innerHTML='<div class="row2" style="justify-content:space-between"><b>Q '+(ex.i+1)+' / '+n+'</b><span class="timer" id="extime">'+fmt(ex.left)+'</span></div>'+
 '<div class="prog"><i style="width:'+((ex.i+1)/n*100)+'%"></i></div>'+
 '<div class="card"><div class="mut">Choose the correct sentence</div>'+q.opts.map((o,i)=>'<button class="opt'+(ex.ans[ex.i]===i?' right':'')+'" data-i="'+i+'">'+esc(o)+'</button>').join('')+'</div>'+
 '<div class="row2" style="justify-content:space-between"><button class="btn" id="exprev"'+(ex.i?'':' disabled')+'>← Prev</button>'+
 (ex.i<n-1?'<button class="btn pri" id="exnext">Next →</button>':'<button class="btn pri" id="exfin">Finish</button>')+'</div>'+
 '<p class="mut">Answered '+ex.ans.filter(a=>a>=0).length+' of '+n+'</p>';
}
$('#exstart').onclick=startExam;
$('#exsrc').onchange=renderExamInfo;
$('#exrun').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='exagain'){$('#exrun').style.display='none';$('#exsetup').style.display='block';renderHist();return}
 if(!ex)return;
 if(b.classList.contains('opt')){ex.ans[ex.i]=+b.dataset.i;renderEx()}
 else if(b.id==='exnext'){ex.i++;renderEx()}
 else if(b.id==='exprev'){ex.i--;renderEx()}
 else if(b.id==='exfin'){if(ex.ans.includes(-1)&&!confirm('Some questions are unanswered. Finish anyway?'))return;finishExam()}
 else if(b.id==='exagain'){$('#exrun').style.display='none';$('#exsetup').style.display='block';renderHist()}
};
function finishExam(){
 clearInterval(exT);
 const n=ex.qs.length;let score=0;const miss=[];
 ex.qs.forEach((q,i)=>{if(ex.ans[i]===q.ans){score++;S.wrong[q.it.k]=Math.max(0,(S.wrong[q.it.k]||0)-1)}else{S.wrong[q.it.k]=(S.wrong[q.it.k]||0)+1;miss.push(i)}});
 const used=n*30-Math.max(0,ex.left),pct=Math.round(score/n*100);
 S.exams.unshift({d:today(),score,n,pct,used});S.exams=S.exams.slice(0,30);save();
 $('#exrun').innerHTML='<div class="card" style="text-align:center"><div style="font-size:40px;font-weight:700;color:'+(pct>=60?'var(--ok)':'var(--bad)')+'">'+pct+'%</div><div>'+score+' / '+n+' correct · '+(pct>=60?'Passed 🎉':'Keep practising 💪')+'</div><div class="mut">Time used '+fmt(used)+'</div></div>'+
 (miss.length?'<h3>Review your mistakes</h3>'+miss.map(i=>{const q=ex.qs[i];return '<div class="res"><div class="dont">'+esc(ex.ans[i]>=0?q.opts[ex.ans[i]]:'(not answered)')+'</div><div class="say">'+esc(q.right)+'</div>'+why(q.it)+'</div>'}).join(''):'<div class="empty">Perfect score!</div>')+
 '<div class="row2"><button class="btn pri" id="exagain">Back</button></div>';
 ex=null;
}
function renderHist(){
 $('#exhist').innerHTML=S.exams.length?S.exams.slice(0,10).map(h=>'<div class="card row2" style="justify-content:space-between;margin:6px 0"><span>'+h.d+'</span><span>'+h.score+'/'+h.n+'</span><b style="color:'+(h.pct>=60?'var(--ok)':'var(--bad)')+'">'+h.pct+'%</b></div>').join(''):'<div class="empty">No exams yet.</div>';
}
/* ---------- init ---------- */
renderDaily();renderStudy(true);renderPStats();renderExamInfo();
</script>
</body>
</html>
